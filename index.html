<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>로컬 AI 코드리뷰 · currentjob</title>
    <meta name="description" content="git diff 를 브라우저 안의 코드 모델이 검토합니다. 코드는 기기 밖으로 나가지 않습니다." />
      <script>try{var d=document.documentElement,t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.dataset.theme=t;var a=localStorage.getItem("accent");if(/^(green|yellow|purple|orange|rose)$/.test(a||""))d.dataset.accent=a}catch(e){}
(function(){var A=/^(green|sky|yellow|purple|orange|rose)$/;function mark(){var c=document.documentElement.dataset.accent||"sky";document.querySelectorAll("[data-cj-accent]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.cjAccent===c))})}document.addEventListener("click",function(e){var tt=e.target.closest&&e.target.closest("[data-cj-theme-toggle]");if(tt){var rt=document.documentElement,nt=rt.dataset.theme==="dark"?"light":"dark";rt.dataset.theme=nt;try{localStorage.setItem("theme",nt)}catch(_){}return}var b=e.target.closest&&e.target.closest("[data-cj-accent]");if(b&&A.test(b.dataset.cjAccent)){var r=document.documentElement,v=b.dataset.cjAccent;if(v==="sky")delete r.dataset.accent;else r.dataset.accent=v;try{localStorage.setItem("accent",v)}catch(_){}mark();var p=b.closest("details");if(p)p.open=false;return}document.querySelectorAll("details.cj-accent[open]").forEach(function(p){if(!p.contains(e.target))p.open=false})});document.addEventListener("toggle",function(e){if(e.target.matches&&e.target.matches("details.cj-accent")&&e.target.open)mark()},true);if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mark);else mark()})();</script>
    <style>
      /* currentjob shared design tokens + author bar — identical on every project site (reference: city-walk-planner). */
      :root{--cj-paper:#f4f7fa;--cj-surface:#fff;--cj-soft:#e9eff5;--cj-ink:#1b3346;--cj-muted:#5b6b7a;--cj-line:#d6e0ea;--cj-warm:#c9703f;--cj-danger:#a13a30;--cj-danger-bg:#faece7;--cj-caution:#875d20;--cj-caution-bg:#fff5df;--cj-code:#eef3f8;--cj-shadow:0 10px 30px #1b334614;--cj-serif:Georgia,"Noto Serif KR",serif;--cj-sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;--cj-mono:ui-monospace,"Cascadia Code",Consolas,monospace;color-scheme:light}
      :root[data-theme=dark]{--cj-paper:#0f151b;--cj-surface:#161e26;--cj-soft:#1d2731;--cj-ink:#e2ebf2;--cj-muted:#97a7b6;--cj-line:#2b3743;--cj-warm:#e59a6a;--cj-danger:#f08a7e;--cj-danger-bg:#3a2320;--cj-caution:#e0b25a;--cj-caution-bg:#342a17;--cj-code:#0b1116;--cj-shadow:0 10px 30px #0006;color-scheme:dark}
      /* Accent palettes, shared by every currentjob project site. Chosen in the header and saved as localStorage "accent" (default: sky).
         Checked contrast (WCAG): accent as text on page/card/tint backgrounds >= 5.2:1, text on accent buttons >= 6.0:1, in both themes. */
      :root{--cj-accent:#0b5f8a;--cj-on-accent:#fff}
      :root[data-theme=dark]{--cj-accent:#7cc6ee;--cj-on-accent:#06202e}
      :root[data-accent=green]{--cj-accent:#245548}:root[data-theme=dark][data-accent=green]{--cj-accent:#7cc4a6;--cj-on-accent:#0e1a14}
      :root[data-accent=yellow]{--cj-accent:#7a5600}:root[data-theme=dark][data-accent=yellow]{--cj-accent:#f0c75e;--cj-on-accent:#261c00}
      :root[data-accent=purple]{--cj-accent:#5f3bab}:root[data-theme=dark][data-accent=purple]{--cj-accent:#b9a3f5;--cj-on-accent:#1c1233}
      :root[data-accent=orange]{--cj-accent:#a8431b}:root[data-theme=dark][data-accent=orange]{--cj-accent:#f4a27c;--cj-on-accent:#2c1206}
      :root[data-accent=rose]{--cj-accent:#a82d5c}:root[data-theme=dark][data-accent=rose]{--cj-accent:#f39bbd;--cj-on-accent:#2e0c1a}
      /* Selected-state tint follows the chosen accent. */
      :root{--cj-soft-2:color-mix(in srgb,var(--cj-accent) 14%,var(--cj-surface))}
      .cj-projects{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;height:34px;padding:0 16px;background:var(--cj-soft);color:var(--cj-ink);border-bottom:1px solid var(--cj-line);font:500 12px/1 var(--cj-sans)}
      .cj-projects a{color:inherit;text-decoration:none;opacity:.68;white-space:nowrap}
      .cj-projects a:hover,.cj-projects a:focus-visible,.cj-projects a[aria-current=page]{opacity:1}
      .cj-projects a[aria-current=page]{font-weight:700;color:var(--cj-accent)}
      .cj-home{font-family:var(--cj-serif);font-size:13px}
      .cj-list{display:flex;align-items:center;gap:14px}
      .cj-projects .cj-theme{display:inline-grid;place-items:center;width:var(--cj-ctl,26px);height:var(--cj-ctl,26px);min-height:0;margin:0;padding:0;border:1px solid var(--cj-line);border-radius:999px;background:var(--cj-surface);color:var(--cj-ink);box-shadow:none;cursor:pointer}
      .cj-theme svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      :root[data-theme=dark] .cj-sun,:root:not([data-theme=dark]) .cj-moon{display:none}
      .cj-accent{position:relative;display:inline-flex;vertical-align:middle}
      .cj-accent>summary{list-style:none;display:inline-grid;place-items:center;width:var(--cj-ctl,26px);height:var(--cj-ctl,26px);border:1px solid var(--cj-line);border-radius:999px;background:var(--cj-surface);cursor:pointer}
      .cj-accent>summary::-webkit-details-marker{display:none}
      .cj-dot{width:12px;height:12px;border-radius:50%;background:var(--cj-accent)}
      .cj-swatches{position:absolute;right:0;top:calc(100% + 8px);z-index:3000;display:grid;grid-template-columns:repeat(3,34px);gap:10px;padding:12px;background:var(--cj-surface);border:1px solid var(--cj-line);border-radius:12px;box-shadow:var(--cj-shadow)}
      .cj-swatches button{width:34px;height:34px;min-height:0;margin:0;padding:0;border:3px solid var(--cj-surface);border-radius:50%;outline:1px solid var(--cj-line);background:var(--l);box-shadow:none;cursor:pointer}
      :root[data-theme=dark] .cj-swatches button{background:var(--d)}
      .cj-swatches button[aria-pressed=true]{outline:2px solid var(--cj-ink)}
      /* App header — same look as city-walk-planner's header: logo mark, serif wordmark, icon nav with an accent underline. */
      .cj-header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:28px;height:64px;padding:0 max(24px,calc((100vw - 1180px)/2));background:color-mix(in srgb,var(--cj-paper) 94%,transparent);border-bottom:1px solid var(--cj-line);backdrop-filter:blur(10px);font-family:var(--cj-sans);box-sizing:border-box}
      .cj-brand{display:flex;align-items:center;gap:10px;color:var(--cj-ink);text-decoration:none;font:600 19px/1.1 var(--cj-serif);letter-spacing:-.4px;white-space:nowrap}
      .cj-brand-mark{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:9px;background:var(--cj-accent);color:var(--cj-on-accent)}
      .cj-brand-mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .cj-nav{display:flex;align-items:stretch;gap:26px;height:100%;margin:0 auto}
      .cj-header .cj-nav :is(a,button,label){display:inline-flex;align-items:center;gap:7px;height:100%;min-height:0;margin:0;padding:0;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;box-shadow:none;color:var(--cj-muted);font:500 14px var(--cj-sans);text-decoration:none;white-space:nowrap;cursor:pointer}
      .cj-header .cj-nav :is(a,label):hover,.cj-header .cj-nav button:hover:not(:disabled){color:var(--cj-ink)}
      .cj-header .cj-nav [aria-current],.cj-header .cj-nav [aria-pressed=true]{color:var(--cj-accent);border-bottom-color:var(--cj-accent);font-weight:700}
      .cj-header .cj-nav button:disabled,.cj-header .cj-nav .is-disabled{opacity:.4;cursor:not-allowed}
      .cj-ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .cj-header-actions{display:flex;align-items:center;gap:8px}
      .cj-pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--cj-line);border-radius:999px;background:var(--cj-surface);color:var(--cj-ink);font:600 13px var(--cj-sans);text-decoration:none;white-space:nowrap}
      .cj-pill:hover{border-color:var(--cj-accent);color:var(--cj-accent)}
      .cj-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--cj-soft-2);color:var(--cj-accent);font:600 12px var(--cj-sans);white-space:nowrap}
      .cj-header .cj-accent{--cj-ctl:36px}
      .cj-header .cj-theme-btn{display:inline-grid;place-items:center;width:36px;height:36px;min-height:0;margin:0;padding:0;border:1px solid var(--cj-line);border-radius:999px;background:var(--cj-surface);color:var(--cj-ink);box-shadow:none;cursor:pointer}
      .cj-header .cj-theme-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      :root[data-theme=dark] .cj-header .cj-sun,:root:not([data-theme=dark]) .cj-header .cj-moon{display:none}
      @media (max-width:760px){
        .cj-header{height:56px;gap:6px;padding:0 12px}
        .cj-brand{font-size:17px}.cj-brand-mark{width:28px;height:28px}
        .cj-nav{gap:2px;margin:0 0 0 auto}
        .cj-nav .cj-label,.cj-pill .cj-label{display:none}
        .cj-header .cj-nav :is(a,button,label){width:44px;justify-content:center;border-bottom-width:2px}
        .cj-pill{width:40px;min-height:40px;padding:0;justify-content:center}
        .cj-header .cj-accent{--cj-ctl:40px}.cj-header .cj-theme-btn{width:40px;height:40px}
      }
      /* Narrow phones: logo mark only, so nav + accent + theme + source fit one row. */
      @media (max-width:480px){.cj-brand>span:last-child{display:none}.cj-header-actions{gap:4px}}
      @media (max-width:560px){.cj-long{display:none}.cj-projects{gap:8px;padding:0 12px}.cj-list{gap:12px}}
    </style>
