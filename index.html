<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로컬 AI 코드리뷰 · currentjob</title>
    <meta name="description" content="git diff 를 브라우저 안의 코드 모델이 검토합니다. 코드는 기기 밖으로 나가지 않습니다." />
      <script>try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
    <style>
      /* currentjob shared design tokens + author bar — identical on every project site (reference: city-walk-planner). */
      :root{--cj-paper:#f5f7f4;--cj-surface:#fff;--cj-soft:#edf1ec;--cj-soft-2:#e3ece3;--cj-ink:#203d34;--cj-muted:#626f68;--cj-line:#dbe1db;--cj-accent:#245548;--cj-on-accent:#fff;--cj-warm:#c9703f;--cj-danger:#a13a30;--cj-danger-bg:#faece7;--cj-caution:#875d20;--cj-caution-bg:#fff5df;--cj-code:#f0f3ef;--cj-shadow:0 10px 30px #203d3414;--cj-serif:Georgia,"Noto Serif KR",serif;--cj-sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;--cj-mono:ui-monospace,"Cascadia Code",Consolas,monospace;color-scheme:light}
      :root[data-theme=dark]{--cj-paper:#111714;--cj-surface:#18201c;--cj-soft:#1f2924;--cj-soft-2:#1f3a30;--cj-ink:#e3ebe6;--cj-muted:#9aaca3;--cj-line:#2e3b34;--cj-accent:#7cc4a6;--cj-on-accent:#0e1a14;--cj-warm:#e59a6a;--cj-danger:#f08a7e;--cj-danger-bg:#3a2320;--cj-caution:#e0b25a;--cj-caution-bg:#342a17;--cj-code:#0d1311;--cj-shadow:0 10px 30px #0006;color-scheme:dark}
      .cj-projects{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;height:34px;padding:0 16px;background:var(--cj-soft);color:var(--cj-ink);border-bottom:1px solid var(--cj-line);font:500 12px/1 var(--cj-sans)}
      .cj-projects a{color:inherit;text-decoration:none;opacity:.68;white-space:nowrap}
      .cj-projects a:hover,.cj-projects a:focus-visible,.cj-projects a[aria-current=page]{opacity:1}
      .cj-projects a[aria-current=page]{font-weight:700;color:var(--cj-accent)}
      .cj-home{font-family:var(--cj-serif);font-size:13px}
      .cj-list{display:flex;align-items:center;gap:14px}
      .cj-projects .cj-theme{display:inline-grid;place-items:center;width:26px;height:26px;min-height:0;margin:0;padding:0;border:1px solid var(--cj-line);border-radius:999px;background:var(--cj-surface);color:var(--cj-ink);box-shadow:none;cursor:pointer}
      .cj-theme svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      :root[data-theme=dark] .cj-sun,:root:not([data-theme=dark]) .cj-moon{display:none}
      @media (max-width:560px){.cj-long{display:none}}
    </style>
  </head>
  <body>
    <nav class="cj-projects" aria-label="currentjob 프로젝트"><a class="cj-home" href="https://currentjob.github.io/portfolio-github-pages/">← <span class="cj-long">currentjob </span>포트폴리오</a><span class="cj-list"><a href="https://currentjob.github.io/yolov8-seg-page/">YOLOv8<span class="cj-long"> 세그멘테이션</span></a><a href="https://currentjob.github.io/ocr-llm-page/">OCR<span class="cj-long"> · LLM 요약</span></a><a href="https://currentjob.github.io/city-walk-planner/">여행<span class="cj-long"> 일정 플래너</span></a><a href="https://currentjob.github.io/local-code-review/" aria-current="page">코드<span class="cj-long">리뷰</span></a><button class="cj-theme" type="button" aria-label="밝은/어두운 테마 전환" onclick="var d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}"><svg class="cj-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="cj-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button></span></nav>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
